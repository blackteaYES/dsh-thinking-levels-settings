name: release

# tag 触发：构建 → npm pack → 把 tarball 附到 GitHub Release。
# 与 ci.yml 的 #master 通道互补：Release 资产是不可变的版本锚点，
# 用户可用直链安装（dsh plugin --profile web add <tarball URL>）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: verify runtime artifacts exist
        run: |
          test -f lib/index.js
          test -f lib/invariant.js
          test -f lib/client.js
      - name: pack tarball
        run: npm pack --pack-destination dist
      - name: attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
